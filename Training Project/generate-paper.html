<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generate Paper</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/generatePaper.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <i class="fa-solid fa-file-circle-check"></i>

            <h2>QPG</h2>

        </div>

        <ul>

            <li>

                <a href="dashboard.html">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="add-question.html">

                    <i class="fa-solid fa-square-plus"></i>

                    Add Question

                </a>

            </li>

            <li>

                <a href="question-bank.html">

                    <i class="fa-solid fa-book"></i>

                    Question Bank

                </a>

            </li>

            <li class="active">

                <a href="generate-paper.html">

                    <i class="fa-solid fa-file-lines"></i>

                    Generate Paper

                </a>

            </li>

            <li>

                <a href="paper.html">

                    <i class="fa-solid fa-print"></i>

                    Generated Paper

                </a>

            </li>

            <li>

                <a href="index.html">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <div class="page-header">

            <h1>Generate Question Paper</h1>

            <p>Select the details and generate a paper instantly.</p>

        </div>

        <div class="paper-form">

            <div class="form-group">

                <label>Exam Name</label>

                <input
                    type="text"
                    id="examName"
                    placeholder="Enter Exam Name">

            </div>

            <div class="form-group">

                <label>Subject</label>

                <select id="subject">

                    <option value="">Select Subject</option>

                    <option>Java</option>

                    <option>C</option>

                    <option>C++</option>

                    <option>Python</option>

                    <option>JavaScript</option>

                </select>

            </div>

            <div class="form-group">

                <label>Difficulty</label>

                <select id="difficulty">

                    <option value="">Select Difficulty</option>

                    <option>Easy</option>

                    <option>Medium</option>

                    <option>Hard</option>

                </select>

            </div>

            <div class="form-group">

                <label>Total Questions</label>

                <input
                    type="number"
                    id="totalQuestions"
                    placeholder="Enter Number">

            </div>
                        <div class="form-group">

                <label>Marks Per Question</label>

                <input
                    type="number"
                    id="marksPerQuestion"
                    placeholder="Enter Marks Per Question">

            </div>

            <div class="form-group">

                <label>Duration</label>

                <input
                    type="text"
                    id="duration"
                    placeholder="Example : 2 Hours">

            </div>

            <div class="form-group">

                <label>Exam Date</label>

                <input
                    type="date"
                    id="examDate">

            </div>

            <div class="form-group">

                <button id="generateBtn">

                    <i class="fa-solid fa-file-circle-plus"></i>

                    Generate Paper

                </button>

            </div>

        </div>

        <!-- Preview -->

        <div class="preview-box">

            <h2>Paper Preview</h2>

            <p>
                Click on
                <b>Generate Paper</b>
                to create a new question paper.
            </p>

            <div id="previewQuestions">

            </div>

        </div>

    </main>

</div>

<script src="js/generatePaper.js"></script>
<script src="js/activity.js"></script>
<script src="js/generatePaper.js"></script>

</body>

</html>
